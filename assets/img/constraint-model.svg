<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Five Layer Constraint Model</title><desc id="desc">Five connected layers named Acquisition, Conversion, Monetization, Retention, and Capacity.</desc><rect width="1100" height="360" rx="28" fill="#fff"/><rect x="40" y="52" width="1020" height="256" rx="28" fill="#1B2B4B"/><g font-family="Arial, Helvetica, sans-serif" font-weight="700"><text x="72" y="110" fill="#fff" font-size="30">The 5-Layer Constraint Model</text><text x="72" y="145" fill="#DDE3EC" font-size="18">Inspect the system before prescribing the fix.</text></g><g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="20"><rect x="76" y="190" width="170" height="72" rx="18" fill="#fff"/><text x="105" y="234" fill="#1B2B4B">Acquisition</text><path d="M258 226h55" stroke="#E8532A" stroke-width="8" stroke-linecap="round"/><rect x="328" y="190" width="170" height="72" rx="18" fill="#fff"/><text x="360" y="234" fill="#1B2B4B">Conversion</text><path d="M510 226h55" stroke="#E8532A" stroke-width="8" stroke-linecap="round"/><rect x="580" y="190" width="170" height="72" rx="18" fill="#fff"/><text x="603" y="234" fill="#1B2B4B">Monetization</text><path d="M762 226h55" stroke="#E8532A" stroke-width="8" stroke-linecap="round"/><rect x="832" y="190" width="170" height="72" rx="18" fill="#fff"/><text x="878" y="234" fill="#1B2B4B">Retention</text><path d="M917 272v18" stroke="#E8532A" stroke-width="8" stroke-linecap="round"/><text x="822" y="305" fill="#fff">Capacity supports delivery.</text></g></svg>
